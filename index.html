<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./output.css" rel="stylesheet">
  <title>Image Adjuster</title>
</head>

<body>
  <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-5xl">
      <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">
        Image Adjuster
      </h1>

      <!-- File Input -->
      <input type="file" accept="image/*" id="imageUpload"
        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 mb-6 file:cursor-pointer cursor-pointer" />

      <div>
        <!-- Brightness Slider -->
        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-2" for="brightness">
            Brightness:
            <span id="brightValue" class="text-indigo-600">0</span>
          </label>
          <input type="range" min="-100" max="100" value="0" id="brightness" disabled
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
        </div>

        <!-- Contrast Slider -->
        <div class="mb-6">
          <label class="block text-gray-700 font-medium mb-2" for="contrast">
            Contrast: <span id="contrastValue" class="text-indigo-600">1.0</span>
          </label>
          <input type="range" min="0" max="2" step="0.1" value="1" id="contrast" disabled
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600" />
        </div>

        <!-- Save Image buttton -->
        <div class="flex justify-end">

          <button id="saveButton" disabled
            class="p-2 sm:p-3 sm:font-semibold bg-indigo-700 text-indigo-50 hover:bg-indigo-600 rounded-lg cursor-pointer disabled:cursor-">
            Save Image
          </button>
        </div>
      </div>
      <!-- Canvas Container -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <h2 class="text-lg font-semibold text-gray-700 mb-2">Original</h2>
          <canvas id="inputCanvas" class="w-full h-auto rounded-lg border border-slate-200"></canvas>
        </div>
        <div>
          <h2 class="text-lg font-semibold text-gray-700 mb-2">Adjusted</h2>
          <canvas id="outputCanvas" class="w-full h-auto rounded-lg border border-slate-200"></canvas>
        </div>
      </div>
    </div>

    <script src="js/openCV.js"type="text/javascript"></script>
    <script src="js/script.js"></script>
</body>

</html>
